<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Log</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
border-radius:15px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px #ccc;
}

.watch-img{
width:100%;
border-radius:12px;
}

button{
background:#111;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
font-size:15px;
}

.count{
font-size:18px;
font-weight:bold;
}
</style>

</head>

<body>

<h1>⌚ Watch Log</h1>

<div id="watches"></div>

<script>

const watches=[
{
name:"ロレックス サブマリーナ ノンデイト",
image:"images/IMG_2638.jpeg"
},
{
name:"ロレックス ヨットマスター37",
image:""
},
{
name:"ロレックス エクスプローラー36",
image:""
},
{
name:"ロレックス GMTマスター2 コンビ エバーローズ",
image:""
},
{
name:"ハミルトン カーキフィールド メカニカル",
image:""
},
{
name:"G-SHOCK 初代復刻モデル",
image:""
}
];


let data=JSON.parse(localStorage.getItem("watchData")) || {};


function wear(name){

if(!data[name]){
data[name]={count:0,last:""};
}

data[name].count++;

let d=new Date();

data[name].last=
d.getFullYear()+"/"+
(d.getMonth()+1)+"/"+
d.getDate();

localStorage.setItem(
"watchData",
JSON.stringify(data)
);

display();

}


function display(){

let area=document.getElementById("watches");

area.innerHTML="";


watches.forEach(w=>{

let item=data[w.name] || {
count:0,
last:"なし"
};


area.innerHTML+=`

<div class="card">

${w.image ?
`<img class="watch-img" src="${w.image}">`
:""}

<h2>⌚ ${w.name}</h2>

<p>
最終着用日：${item.last}
</p>

<p class="count">
着用回数：${item.count}回
</p>

<button onclick="wear('${w.name}')">
今日着けた
</button>

</div>

`;

});

}

display();

</script>

</body>
</html>
