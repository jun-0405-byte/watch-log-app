<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Watch Log</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<h1>⌚ Watch Log</h1>


<div class="dashboard">

<h2>📊 Dashboard</h2>

<p id="totalWatch"></p>

<p id="totalCount"></p>

<p id="topWatch"></p>

<p id="lastWatch"></p>

</div>


<div class="card">

<h2>🏆 着用ランキング</h2>

<div id="ranking"></div>

</div>


<div class="card">

<h2>📅 Wear Calendar</h2>

<div id="calendar"></div>

</div>
<div class="card">

<h2>📝 着用登録</h2>

<label>
📅 日付
</label>

<br>

<input type="date" id="wearDate">

<br><br>

<label>
⌚ 時計
</label>

<br>

<select id="watchSelect"></select>

<br><br>

<button onclick="addWearLog()">
記録する
</button>

</div>

<h2>⌚ Collection</h2>

<div id="watches"></div>


<script src="app.js"></script>

</body>

</html>
