<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Watch Log</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div id="mainPage">

<h1>⌚ Watch Log</h1>


<div class="dashboard">

<h2>📊 Dashboard</h2>

<p id="totalWatch"></p>

<p id="totalCount"></p>

<p id="topWatch"></p>

<p id="lastWatch"></p>

</div>


<div class="card">

<h2>🏆 着用ランキング</h2>

<div id="ranking"></div>

</div>


<div class="card">

<h2>📅 Wear Calendar</h2>

<div class="calendar-header">

<button onclick="changeMonth(-1)">◀</button>

<h3 id="calendarTitle"></h3>

<button onclick="changeMonth(1)">▶</button>

</div>

<div id="calendar"></div>

</div>


<div class="card">

<h2>📝 着用登録</h2>

<label>📅 日付</label>

<br>

<input type="date" id="wearDate">

<br><br>

<label>⌚ 時計</label>

<br>

<select id="watchSelect"></select>

<br><br>

<button onclick="addWearLog()">
記録する
</button>

</div>


<div class="card">

<h2>📋 着用履歴</h2>

<div id="wearHistory"></div>

</div>


<h2>⌚ Collection</h2>

<div id="watches"></div>

</div>


<!-- ==========================
     時計詳細ページ
========================== -->

<div id="watchDetailPage" style="display:none;">

<button
  class="back-button"
  onclick="closeWatchDetail()"
>
← Collectionに戻る
</button>


<div class="card watch-detail">

<img
  id="detailWatchImage"
  class="detail-image"
  src=""
  alt=""
>


<h2 id="detailWatchName"></h2>


<p id="detailWatchCount"></p>

<p id="detailWatchLast"></p>


<h3>📋 この時計の着用履歴</h3>

<div id="detailWatchHistory"></div>

</div>

</div>


<script src="app.js"></script>

</body>

</html>
